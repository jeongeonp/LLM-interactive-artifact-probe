<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artifact Gallery · Demo</title>
<style>
  :root { --bg:#f7f6f2; --panel:#fff; --line:#e4e1d8; --accent:#b4622e; --text:#2a2725; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); background:var(--bg); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header b { color:var(--accent); }
  header .sub { color:#8a857c; font-size:12px; }
  #tabs { display:flex; gap:5px; padding:8px 10px; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--line); }
  .tab { flex:0 0 auto; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:#f2efe8; color:var(--text); font-size:12px; cursor:pointer; white-space:nowrap; }
  .tab:hover { border-color:var(--accent); }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  #frame { flex:1; width:100%; border:0; background:#fff; }
</style>
</head>
<body>
  <header>
    <b>Interactive artifact gallery</b> <span class="sub">— 8 non-chart artifact types for the Maya relocation scenario, one per tab. (Preview; a real session generates these live.)</span>
  </header>
  <div id="tabs"></div>
  <iframe id="frame" sandbox="allow-scripts" title="artifact"></iframe>
<script>
const ARTIFACTS = [
  ["Word cloud", "1-wordcloud.html"],
  ["Affinity board", "2-affinity.html"],
  ["Claim: supports/contradicts", "3-claim.html"],
  ["Annotated timeline", "4-timeline.html"],
  ["Dual-layer map", "5-dualmap.html"],
  ["Aggregate ↔ story", "6-aggregate.html"],
  ["Highlight & code", "7-code-reader.html"],
  ["Causal map", "8-causalmap.html"],
];
const tabsEl = document.getElementById("tabs");
const frame = document.getElementById("frame");
function show(i) {
  document.querySelectorAll(".tab").forEach((t, j) => t.classList.toggle("active", i === j));
  frame.src = "/demo-artifacts/" + ARTIFACTS[i][1];
}
ARTIFACTS.forEach(([label], i) => {
  const t = document.createElement("div");
  t.className = "tab";
  t.textContent = (i + 1) + " · " + label;
  t.addEventListener("click", () => show(i));
  tabsEl.appendChild(t);
});
show(0);
</script>
</body>
</html>
