<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Probe · Review</title>
<style>
  :root { --bg:#f7f6f2; --panel:#fff; --line:#e4e1d8; --accent:#b4622e; --text:#2a2725; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); background:var(--bg); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header b { color:var(--accent); }
  header a { color:#6f6a61; font-size:13px; text-decoration:none; }
  header a:hover { color:var(--accent); }
  main { display:flex; flex:1; min-height:0; }
  #side { width:240px; min-width:200px; overflow-y:auto; border-right:1px solid var(--line); background:var(--panel); }
  .pgroup { border-bottom:2px solid var(--line); }
  .phead { position:sticky; top:0; z-index:1; background:#efe9df; padding:7px 14px;
           font-weight:700; font-size:15px; display:flex; align-items:baseline; gap:8px;
           border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  .phead:hover { background:#e7e0d2; }
  /* Nested groups inside "Other sessions" get a slightly different, more muted tone so
     they read as a distinct tier from the main study pids at a glance. */
  .subgroups .phead { background:#e9e4f0; }
  .subgroups .phead:hover { background:#ded6e8; }
  .phead .caret { font-size:10px; color:#8a857c; transition:transform .12s; display:inline-block; }
  .pgroup.collapsed .phead .caret { transform:rotate(-90deg); }
  .pgroup.collapsed .pitem { display:none; }
  .pgroup.collapsed .subgroups { display:none; }
  .phead .n { font-weight:500; font-size:11px; color:#8a857c; margin-left:auto; }
  .phead .pdate { font-weight:500; font-size:11px; color:#a39c8f; }
  .pitem { padding:9px 14px 9px 16px; border-bottom:1px solid var(--line); cursor:pointer;
           border-left:3px solid transparent; }
  .pitem:last-child { border-bottom:0; }
  .pitem:hover { background:#f2efe8; }
  .pitem.active { background:#efe9df; border-left-color:var(--accent); }
  .pitem .tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:4px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:11px; font-size:11px; font-weight:600; letter-spacing:.2px; }
  .pill.task { background:#e7eef7; color:#3a5a80; }
  .pill.cond-interactive { background:#e3f0e3; color:#356b35; }
  .pill.cond-static { background:#f3e8dc; color:#8a5a2b; }
  .pill.cond-text, .pill.cond-textonly { background:#ece7f2; color:#5b4b82; }
  .pill.cond-none { background:#eee; color:#888; }
  .pill.cond { background:#eef0f2; color:#667; } /* fallback for other cond values */
  .pitem .subpid { font-size:12px; font-weight:700; color:#5a564e; margin-bottom:3px; }
  .pitem .stat { font-size:11px; color:#8a857c; }
  .pitem .stat b { color:#5a564e; font-weight:700; }
  #detail { flex:1; overflow-y:auto; padding:20px 24px; }
  .muted { color:#8a857c; }
  .tabs { display:flex; gap:6px; margin:6px 0 16px; }
  .tabs button { padding:6px 14px; border:1px solid var(--line); border-radius:8px; background:#f2efe8; cursor:pointer; font-size:13px; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .msg { margin:0 0 12px; max-width:760px; }
  .msg .role { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#8a857c; margin-bottom:3px; }
  .bubble { padding:9px 12px; border-radius:10px; white-space:pre-wrap; }
  .msg.user .bubble { background:#efe9df; }
  .msg.assistant .bubble { background:var(--panel); border:1px solid var(--line); }
  /* Full view: side-by-side like the live participant interface — chat on the left,
     scrollable; a tabbed artifact pane on the right showing one artifact at a time. */
  .fullview { display:flex; gap:14px; align-items:flex-start; height:74vh; }
  .fv-chat { flex:0 0 42%; min-width:280px; height:100%; overflow-y:auto; padding-right:6px; }
  .fv-art { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .fv-tabs { display:flex; gap:5px; padding:6px 8px; overflow-x:auto; background:#faf7f2; border-bottom:1px solid var(--line); flex:none; }
  .fv-tabs:empty { display:none; }
  .fv-tab { flex:0 0 auto; padding:5px 11px; border:1px solid var(--line); border-radius:7px; background:#f2efe8; font-size:12px; cursor:pointer; white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis; }
  .fv-tab:hover { border-color:var(--accent); }
  .fv-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .fv-frame { flex:1; width:100%; border:0; background:#fff; }
  .artmark { margin:10px 0; color:var(--accent); font-size:13px; font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; overflow:hidden; }
  .card .hd { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .card .hd .grow { flex:1; }
  .card .hd a { color:var(--accent); text-decoration:none; font-weight:600; }
  .card iframe { width:100%; height:420px; border:0; background:#fff; }
  table { border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  th { background:#efe9df; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#6f6a61; }
  tr:last-child td { border-bottom:0; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .artsplit { display:flex; gap:14px; align-items:flex-start; }
  .alist { width:170px; flex:none; display:flex; flex-direction:column; gap:6px; }
  .aitem { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); cursor:pointer; }
  .aitem:hover { background:#f2efe8; }
  .aitem.active { background:#efe9df; border-color:var(--accent); }
  .aitem .meta { font-size:11px; color:#8a857c; margin-top:2px; }
  .astage { flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .astage-hd { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .astage-hd .grow { flex:1; }
  .astage-hd a { color:var(--accent); text-decoration:none; font-weight:600; }
  .astage iframe { width:100%; height:520px; border:0; background:#fff; display:block; }
</style>
</head>
<body>
<header>
  <b>Probe — Review</b>
  <span class="muted" style="font-size:13px">read conversations · open the artifacts they built</span>
  <a href="/admin.html" style="margin-left:auto">Export / summary →</a>
</header>
<main>
  <div id="side"><div class="pitem muted">Loading…</div></div>
  <div id="detail"><p class="muted">Select a participant on the left.</p></div>
</main>
<script>
const side = document.getElementById("side");
const detail = document.getElementById("detail");
const fmt = t => t ? new Date(t).toLocaleString() : "";
const mmdd = t => { if (!t) return ""; const d = new Date(t); return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`; };
let active = null;

async function loadSide() {
  const rows = await (await fetch("/api/summary")).json();
  if (!rows.length) { side.innerHTML = '<div class="pitem muted">No data yet.</div>'; return; }
  // Group sessions under each participant so one pid isn't scattered across rows.
  // All test pids (test, Test, test-001, …) collapse into a single "test*" group.
  const groupKeyOf = (pid) => (/^test/i.test(pid) ? "test*" : pid);
  const groups = new Map();
  for (const r of rows) {
    const pid = r.pid ?? "anon";
    const key = groupKeyOf(pid);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const condClass = (c) => {
    const k = "cond-" + String(c ?? "none").replace(/[^a-z0-9]/gi, "").toLowerCase();
    // only a known set gets a specific color; anything else uses the generic pill
    return /^cond-(interactive|static|text|textonly|none)$/.test(k) ? k : "cond";
  };
  const renderGroup = ([key, sess]) => {
    const aggregated = sess.some(r => (r.pid ?? "anon") !== key); // test* holds many pids
    const items = sess.map(r => {
      const pid = r.pid ?? "anon";
      return `
      <div class="pitem" data-pid="${encodeURIComponent(pid)}" data-task="${encodeURIComponent(r.task ?? "")}" data-cond="${encodeURIComponent(r.cond ?? "")}">
        ${aggregated ? `<div class="subpid">${pid}</div>` : ""}
        <div class="tags">
          <span class="pill ${condClass(r.cond)}">${r.cond ?? "—"}</span>
          <span class="pill task">${r.task ?? "—"}</span>
        </div>
        <div class="stat"><b>${r.chat_turns ?? 0}</b> turns · <b>${r.artifacts ?? 0}</b> artifacts</div>
      </div>`;
    }).join("");
    // Keep the active participants (P6–P9) expanded; collapse everything else by default.
    const openByDefault = /^p[6-9]$/i.test(key);
    return `<div class="pgroup${openByDefault ? "" : " collapsed"}">
      <div class="phead"><span class="caret">▼</span>${key}<span class="pdate">${mmdd(sess[0]?.first_ts)}</span><span class="n">${sess.length} session${sess.length > 1 ? "s" : ""}</span></div>
      ${items}
    </div>`;
  };
  // Split into the current study's pids (I* / S* — interactive / static naming convention)
  // and everything else (test*, older P# pids, ...). The "everything else" bucket is real
  // data, still fully reachable — just nested one level deeper under its own collapsed
  // section so it's out of the way instead of cluttering the main list.
  const studyEntries = [], otherEntries = [];
  for (const entry of groups.entries()) (/^[is]/i.test(entry[0]) ? studyEntries : otherEntries).push(entry);
  const otherSection = otherEntries.length ? `
    <div class="pgroup collapsed" id="otherSection">
      <div class="phead"><span class="caret">▼</span>Other sessions<span class="n">${otherEntries.length} pid${otherEntries.length > 1 ? "s" : ""}</span></div>
      <div class="subgroups">${otherEntries.map(renderGroup).join("")}</div>
    </div>` : "";
  side.innerHTML = studyEntries.map(renderGroup).join("") + otherSection;
  // Click a participant header to collapse/expand its sessions.
  side.querySelectorAll(".phead").forEach(h =>
    h.addEventListener("click", (e) => { e.stopPropagation(); h.parentElement.classList.toggle("collapsed"); }));
  side.querySelectorAll(".pitem").forEach(el =>
    el.addEventListener("click", () => selectPid(
      decodeURIComponent(el.dataset.pid),
      decodeURIComponent(el.dataset.task),
      decodeURIComponent(el.dataset.cond),
      el)));
}

async function selectPid(pid, task, cond, el, opts = {}) {
  side.querySelectorAll(".pitem").forEach(p => p.classList.remove("active"));
  if (el) el.classList.add("active");
  active = pid;
  detail.innerHTML = '<p class="muted">Loading…</p>';
  const qs = "pid=" + encodeURIComponent(pid) +
    (task ? "&task=" + encodeURIComponent(task) : "") +
    (cond ? "&cond=" + encodeURIComponent(cond) : "");
  const events = await (await fetch("/api/events?" + qs)).json();

  const chats = events.filter(e => e.kind === "chat");
  const arts = events.filter(e => e.kind === "artifact");
  const tele = events.filter(e => e.kind === "telemetry");

  const views = {
    transcript: () => renderTranscript(events),
    full: () => renderFull(events, opts.art),
    artifacts: () => renderArtifacts(arts, opts.art),
    activity: () => renderActivity(tele, arts),
  };

  detail.innerHTML = `
    <h2 style="margin:0">${pid} <span class="muted" style="font-size:14px; font-weight:400">
      ${cond || "—"} · ${task || "—"} · ${chats.length} turns · ${arts.length} artifacts · ${tele.length} interactions</span></h2>
    <div class="tabs">
      <button data-v="transcript" class="active">Transcript</button>
      <button data-v="full">Full view (as shown)</button>
      <button data-v="artifacts">Artifacts (${arts.length})</button>
      <button data-v="activity">Activity</button>
      <a href="/api/export.json?pid=${encodeURIComponent(pid)}" style="margin-left:auto; align-self:center; font-size:13px">⭳ JSON</a>
      <a href="/api/export.csv?pid=${encodeURIComponent(pid)}" style="align-self:center; font-size:13px">⭳ CSV</a>
    </div>
    <div id="view"></div>`;
  const view = detail.querySelector("#view");
  const render = v => { view.innerHTML = ""; view.appendChild(views[v]()); };
  const pick = (v) => {
    detail.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x.dataset.v === v));
    render(v);
  };
  detail.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => pick(b.dataset.v)));
  pick(views[opts.tab] ? opts.tab : "transcript");
}

function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d; }

function renderTranscript(events) {
  const box = document.createElement("div");
  for (const e of events) {
    if (e.kind === "chat") {
      const u = e.data?.user;
      if (u != null) box.appendChild(el(`<div class="msg user"><div class="role">user · ${fmt(e.ts)}</div><div class="bubble"></div></div>`)).lastChild.querySelector(".bubble").textContent = typeof u === "string" ? u : JSON.stringify(u);
      const prose = (e.data?.assistant || "").replace(/```html[\s\S]*?```/gi, "").trim();
      const a = el(`<div class="msg assistant"><div class="role">assistant</div><div class="bubble"></div></div>`);
      a.querySelector(".bubble").textContent = prose || "(built an artifact →)";
      box.appendChild(a.firstChild);
    } else if (e.kind === "artifact") {
      box.appendChild(el(`<div class="artmark">🌐 created artifact #${e.data?.seq ?? ""} · ${fmt(e.ts)} · ${(e.data?.chars ?? 0).toLocaleString()} chars</div>`).firstChild);
    }
  }
  if (!box.children.length) box.innerHTML = '<p class="muted">No conversation.</p>';
  return box;
}

// Reconstructs the conversation the way the participant actually saw it: chat transcript
// on the left, a tabbed artifact pane on the right (one tab per artifact, in creation
// order) — same side-by-side layout as the live interface, not a linear scroll. Purely
// from the events already loaded for this session — no separate fetches, no /api/log calls.
function renderFull(events, startSeq) {
  const wrap = document.createElement("div");
  wrap.className = "fullview";
  const chatCol = document.createElement("div");
  chatCol.className = "fv-chat";
  const artCol = document.createElement("div");
  artCol.className = "fv-art";
  const tabsEl = document.createElement("div");
  tabsEl.className = "fv-tabs";
  const frame = document.createElement("iframe");
  frame.sandbox = "allow-scripts"; // read-only replay — no telemetry script injected
  frame.className = "fv-frame";
  artCol.append(tabsEl, frame);
  wrap.append(chatCol, artCol);

  const fenceRe = /```html\s*([\s\S]*?)```/gi;
  const artifacts = []; // { html, title }
  const showArtifact = (i) => {
    frame.srcdoc = artifacts[i].html;
    tabsEl.querySelectorAll(".fv-tab").forEach((t, ti) => t.classList.toggle("active", ti === i));
  };
  const addTab = (i) => {
    const tab = document.createElement("div");
    tab.className = "fv-tab";
    tab.textContent = artifacts[i].title || `Artifact ${i + 1}`;
    tab.addEventListener("click", () => showArtifact(i));
    tabsEl.appendChild(tab);
  };
  const titleOf = (html) => {
    const m = html.match(/<title[^>]*>([^<]+)<\/title>/i);
    return m ? m[1].trim().slice(0, 22) : null;
  };

  for (const e of events) {
    if (e.kind !== "chat") continue;
    const u = e.data?.user;
    if (u != null) {
      const ub = el(`<div class="msg user"><div class="role">user · ${fmt(e.ts)}</div><div class="bubble"></div></div>`).firstChild;
      ub.querySelector(".bubble").textContent = typeof u === "string" ? u : JSON.stringify(u);
      chatCol.appendChild(ub);
    }
    const raw = e.data?.assistant || "";
    const prose = raw.replace(fenceRe, "").trim();
    const ab = el(`<div class="msg assistant"><div class="role">assistant</div><div class="bubble"></div></div>`).firstChild;
    ab.querySelector(".bubble").textContent = prose || "(built an artifact →)";
    chatCol.appendChild(ab);
    fenceRe.lastIndex = 0;
    let m;
    while ((m = fenceRe.exec(raw))) {
      const html = m[1].trim();
      if (!html) continue;
      artifacts.push({ html, title: titleOf(html) });
      addTab(artifacts.length - 1);
    }
  }
  if (artifacts.length) showArtifact(startSeq ? Math.min(Math.max(+startSeq - 1, 0), artifacts.length - 1) : artifacts.length - 1);
  else artCol.innerHTML = '<p class="muted">No artifact in this session.</p>';
  if (!chatCol.children.length) chatCol.innerHTML = '<p class="muted">No conversation.</p>';
  return wrap;
}

function renderArtifacts(arts, startSeq) {
  const box = document.createElement("div");
  if (!arts.length) { box.innerHTML = '<p class="muted">No artifacts created.</p>'; return box; }
  box.className = "artsplit";
  const listItems = arts.map((a, i) =>
    `<div class="aitem${i === 0 ? " active" : ""}" data-i="${i}">
       <div><b>#${a.data?.seq ?? (i + 1)}</b></div>
       <div class="meta">${fmt(a.ts)}<br>${(a.data?.chars ?? 0).toLocaleString()} chars</div>
     </div>`).join("");
  box.innerHTML = `
    <div class="alist">${listItems}</div>
    <div class="astage">
      <div class="astage-hd"><span class="grow" id="aTitle"></span><a id="aOpen" target="_blank">Open ↗</a></div>
      <iframe id="aFrame" sandbox="allow-scripts" title="artifact"></iframe>
    </div>`;
  const frame = box.querySelector("#aFrame");
  const title = box.querySelector("#aTitle");
  const open = box.querySelector("#aOpen");
  const show = (i) => {
    const a = arts[i];
    const f = a.data?.file;
    frame.src = f || "about:blank";
    title.innerHTML = `<b>#${a.data?.seq ?? (i + 1)}</b> <span class="muted">${fmt(a.ts)} · ${(a.data?.chars ?? 0).toLocaleString()} chars</span>`;
    open.href = f || "#";
    box.querySelectorAll(".aitem").forEach(x => x.classList.toggle("active", +x.dataset.i === i));
  };
  box.querySelectorAll(".aitem").forEach(it =>
    it.addEventListener("click", () => show(+it.dataset.i)));
  const startIdx = startSeq ? arts.findIndex(a => String(a.data?.seq) === String(startSeq)) : -1;
  show(startIdx >= 0 ? startIdx : 0);
  return box;
}

function renderActivity(tele, arts) {
  const box = document.createElement("div");
  const byType = {};
  const hbByArt = {};
  for (const e of tele) {
    byType[e.type] = (byType[e.type] || 0) + 1;
    if (e.type === "heartbeat") { const k = e.data?.artifact ?? "—"; hbByArt[k] = (hbByArt[k] || 0) + 1; }
  }
  const typeRows = Object.entries(byType).sort((a,b)=>b[1]-a[1])
    .map(([t,n]) => `<tr><td>${t}</td><td class="num">${n}</td></tr>`).join("") || '<tr><td colspan="2" class="muted">none</td></tr>';
  const timeRows = Object.entries(hbByArt).sort((a,b)=>b[1]-a[1])
    .map(([k,n]) => `<tr><td>${k === "—" ? "(unattributed)" : "Artifact #" + k}</td><td class="num">~${n*10}s</td></tr>`).join("") || '<tr><td colspan="2" class="muted">none</td></tr>';
  box.innerHTML = `
    <div style="display:flex; gap:24px; flex-wrap:wrap">
      <div><h3 style="margin:0 0 8px">Interaction counts</h3>
        <table><thead><tr><th>Event</th><th class="num">Count</th></tr></thead><tbody>${typeRows}</tbody></table></div>
      <div><h3 style="margin:0 0 8px">Approx. time per artifact</h3>
        <p class="muted" style="margin:0 0 8px; max-width:340px; font-size:12px">Estimated from 5-second heartbeats while an artifact tab was active. Cross-check against your screen recording.</p>
        <table><thead><tr><th>Artifact</th><th class="num">~Time</th></tr></thead><tbody>${timeRows}</tbody></table></div>
    </div>`;
  return box;
}

// Deep link: /review.html?pid=I5&task=relocation&cond=interactive&tab=full&art=3
// (used by /artifact-review's "Context" links) — opens that session, tab and artifact.
loadSide().then(() => {
  const q = new URLSearchParams(location.search);
  const pid = q.get("pid");
  if (!pid) return;
  const task = q.get("task") || "", cond = q.get("cond") || "";
  const item = [...side.querySelectorAll(".pitem")].find(p =>
    decodeURIComponent(p.dataset.pid) === pid &&
    (!task || decodeURIComponent(p.dataset.task) === task) &&
    (!cond || decodeURIComponent(p.dataset.cond) === cond));
  if (item) {
    for (let g = item.closest(".pgroup"); g; g = g.parentElement?.closest(".pgroup")) g.classList.remove("collapsed");
    item.scrollIntoView({ block: "center" });
  }
  selectPid(pid, task, cond, item, { tab: q.get("tab") || "full", art: q.get("art") });
});
</script>
</body>
</html>
