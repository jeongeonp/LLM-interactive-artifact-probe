<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Process Review</title>
<style>
  :root { --pin:#c0671c; --bg:#f7f6f2; --panel:#fff; --line:#e4e1d8; --accent:#b4622e; --text:#2a2725; --muted:#8a857c; --soft:#faf7f2; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); background:var(--bg); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:14px; padding:9px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { color:var(--accent); }
  header label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  header input[type=text] { width:110px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; font:12px ui-monospace,Menlo,monospace; }
  header input#coder.missing { border-color:#b3261e; box-shadow:0 0 0 2px #fde8e4; }
  header a, .linkbtn { color:#6f6a61; font-size:13px; text-decoration:none; background:none; border:0; cursor:pointer; padding:0; font-family:inherit; }
  header a:hover, .linkbtn:hover { color:var(--accent); }
  .grow { flex:1; }
  .muted { color:var(--muted); }
  kbd { font:11px ui-monospace,Menlo,monospace; background:#f2efe8; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  button.b { padding:3px 9px; border:1px solid var(--line); border-radius:6px; background:#f2efe8; cursor:pointer; font:12px inherit; color:var(--text); white-space:nowrap; }
  button.b:hover { border-color:var(--accent); }
  button.b.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { display:flex; flex:1; min-height:0; }

  /* ---- sidebar: one row per recording (pid), a chip per task in it ---- */
  #side { width:220px; flex:none; overflow-y:auto; border-right:1px solid var(--line); background:var(--panel); padding:12px; }
  #side h3 { margin:14px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  #side h3:first-child { margin-top:0; }
  .prow { display:flex; align-items:center; gap:6px; padding:3px 0; }
  .prow > b { width:34px; font-size:13px; }
  .tchip { display:flex; align-items:center; gap:4px; padding:1px 7px; border:1px solid var(--line); border-radius:10px; font-size:11px; cursor:pointer; background:#f6f3ed; white-space:nowrap; }
  .tchip:hover { border-color:var(--accent); }
  .tchip.on { box-shadow:0 0 0 2px var(--accent); border-color:var(--accent); background:#fff; }
  .tchip .dot { width:8px; height:8px; border-radius:50%; background:#d8d3c9; }
  .tchip .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .legend { font-size:11px; color:var(--muted); margin-top:14px; line-height:1.8; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

  /* ---- center: video, palette, timeline, sequence ---- */
  #center { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  #vwrap { flex:1 1 auto; min-height:220px; background:#111; position:relative; }
  #vwrap video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#111; }
  #vmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:14px; padding:20px; text-align:center; pointer-events:none; }
  .ctl { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12px; flex-wrap:wrap; }
  .ctl .time { font:13px ui-monospace,Menlo,monospace; min-width:150px; }
  .ctl select { font:12px inherit; padding:2px 4px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .ctl .sep { width:1px; height:18px; background:var(--line); }
  #palette { display:flex; flex-direction:column; gap:4px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  /* palette: nodes (boxes in the figure) vs arrows (processes), per loop */
  #palette .pgrid { display:grid; grid-template-columns:auto 1fr 1fr; gap:5px 14px; align-items:center; }
  #palette .ph { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  #palette .ph small { font-weight:400; text-transform:none; letter-spacing:0; }
  #palette .cell { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .nodeb { display:flex; align-items:center; gap:5px; padding:3px 9px; border-radius:3px; font-size:11.5px; font-weight:700; cursor:pointer; border:0; background:var(--c); color:var(--ink,#fff); box-shadow:0 1px 0 rgba(0,0,0,.25); }
  .nodeb i { font-style:normal; font-size:10px; opacity:.85; }
  .nodeb:hover { filter:brightness(1.08); box-shadow:0 0 0 2px #2a2725; }
  .nodeb:disabled, .arrb:disabled { opacity:.45; cursor:not-allowed; }
  .arrb { display:flex; align-items:center; gap:4px; padding:2px 7px 2px 4px; border-radius:11px; font-size:11.5px; font-style:italic; cursor:pointer; border:1px solid transparent; background:none; color:var(--text); }
  .arrb:hover { border-color:var(--c); background:#faf7f2; }
  .arrb i { font-style:normal; font-weight:700; font-size:10px; color:var(--c); }
  .arrb b { color:var(--c); font-style:normal; }

  #tlwrap { background:var(--panel); border-bottom:1px solid var(--line); padding:4px 12px 6px; user-select:none; }
  #tl { position:relative; cursor:pointer; }
  .tlrow { position:relative; }
  #tlRuler { height:16px; border-bottom:1px solid var(--line); }
  #tlRuler span { position:absolute; top:0; font-size:9.5px; color:var(--muted); transform:translateX(-50%); white-space:nowrap; }
  #tlRuler span::after { content:""; position:absolute; left:50%; top:13px; height:3px; border-left:1px solid #c9c3b8; }
  #tlEvents { height:20px; }
  .ev { position:absolute; top:3px; transform:translateX(-50%); }
  .ev.art { width:14px; height:14px; background:#2a2725; color:#fff; font-size:8.5px; font-weight:700; border-radius:3px; text-align:center; line-height:14px; z-index:2; }
  .ev.art:hover { background:var(--accent); }
  .ev.turn { top:6px; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:7px solid #a9a296; }
  .ev.turn:hover { border-top-color:var(--accent); }
  .taskband { position:absolute; top:0; bottom:0; background:rgba(180,98,46,.07); border-left:1px dashed rgba(180,98,46,.5); border-right:1px dashed rgba(180,98,46,.5); pointer-events:none; }
  #tlSegs { height:30px; background:#f4f1ea; border-radius:4px; }
  .seg { position:absolute; top:2px; bottom:2px; background:var(--c); border-radius:3px; color:#fff; font-size:10px; font-weight:600; overflow:hidden; white-space:nowrap; padding:2px 4px; line-height:22px; min-width:2px; border-right:1px solid rgba(255,255,255,.6); }
  .seg.open { -webkit-mask-image:linear-gradient(90deg,#000 70%,rgba(0,0,0,.35)); mask-image:linear-gradient(90deg,#000 70%,rgba(0,0,0,.35)); }
  .seg.sel { box-shadow:0 0 0 2px #2a2725; z-index:3; overflow:visible; }
  .seg .h { position:absolute; top:-2px; bottom:-2px; width:7px; background:#2a2725; cursor:ew-resize; border-radius:2px; }
  .seg .h0 { left:-4px; } .seg .h1 { right:-4px; }
  .orow { height:10px; margin-top:2px; }
  .orow .seg { top:0; bottom:0; padding:0; border-radius:2px; }
  .orow .who { position:absolute; right:100%; margin-right:3px; font-size:9px; color:var(--muted); top:-2px; }
  #playhead { position:absolute; top:0; bottom:0; width:0; border-left:2px solid #d0342c; pointer-events:none; z-index:5; }
  #hover { position:absolute; top:-1px; font-size:10px; background:#2a2725; color:#fff; padding:0 4px; border-radius:3px; transform:translateX(-50%); pointer-events:none; display:none; z-index:6; white-space:nowrap; }
  .tlbar { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-bottom:3px; }

  #seqpanel { flex:none; height:230px; overflow-y:auto; background:var(--soft); padding:8px 14px 10px; }
  .seqhd { display:flex; align-items:center; gap:10px; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin-bottom:4px; }
  .seqrow { display:flex; flex-wrap:wrap; align-items:flex-end; row-gap:6px; margin-bottom:8px; }
  .seqrow .who { font-size:11px; font-weight:700; color:var(--muted); width:100%; }
  /* sequence: node pins are boxes (as in the figure); process segments are labelled arrows */
  .nd { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .nd .nb { background:var(--c); color:var(--ink,#fff); font-weight:700; font-size:12.5px; padding:2px 8px; border-radius:3px; white-space:nowrap; box-shadow:0 1px 0 rgba(0,0,0,.25); }
  .nd.sel .nb { box-shadow:0 0 0 2px #2a2725; }
  .nd .nm, .pr .nm { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pr { display:flex; flex-direction:column; align-items:stretch; cursor:pointer; padding:0 3px; border-radius:4px; min-width:56px; }
  .pr:hover { background:#efe9df; }
  .pr.sel { background:#efe0d2; }
  .pr .pl { font-size:12px; font-style:italic; color:#4a4640; white-space:nowrap; text-align:center; padding:0 4px; }
  .pr .pa { position:relative; height:2px; background:var(--c); margin:2px 6px 3px 2px; }
  .pr .pa::after { content:""; position:absolute; right:-6px; top:-4px; border-left:7px solid var(--c); border-top:5px solid transparent; border-bottom:5px solid transparent; }
  .pr .nm { text-align:center; }
  .arrow { color:#9a948a; padding:0 3px 15px; font-size:13px; }
  /* groups: one box per artifact period (or per foraging/sensemaking run); arrows between boxes are heavier */
  .seqrow.grouped { align-items:stretch; row-gap:8px; }
  .sgrp { display:flex; flex-direction:column; border:1px solid var(--gb,#d8d3c9); border-left:3px solid var(--gb,#b9b2a6); background:var(--gbg,#f3efe7); border-radius:8px; padding:3px 8px 4px; min-width:0; }
  .sgrp .gh { font-size:10.5px; font-weight:700; color:var(--gt,#6f6a61); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px; }
  .sgrp .gh span { font-weight:400; }
  .sgrp .gb { display:flex; flex-wrap:wrap; align-items:flex-end; }
  .sgrp.F { --gb:#9db8de; --gbg:#eef3fa; --gt:#2f5f9f; }
  .sgrp.S { --gb:#e2ad94; --gbg:#fbf1ea; --gt:#a8481d; }
  .sgrp.pre { --gbg:#f7f5f0; border-style:dashed; border-left-style:solid; }
  .gwrap { display:flex; align-items:stretch; min-width:0; }
  .garrow { align-self:center; color:#6f6a61; font-size:18px; padding:0 5px; font-weight:700; }
  #plot { width:100%; display:block; }
  .empty { color:var(--muted); font-size:13px; padding:8px 0; }

  /* ---- right panel ---- */
  #right { width:370px; flex:none; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--panel); min-height:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; padding:8px 4px; border:0; background:none; cursor:pointer; font:13px inherit; color:var(--muted); border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .pane { flex:1; overflow-y:auto; padding:12px 14px; display:none; font-size:13px; }
  .pane.on { display:block; }
  .pane h4 { margin:12px 0 5px; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .pane h4:first-child { margin-top:0; }
  .sess { background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .sess .top { display:flex; align-items:center; gap:8px; }
  .sess select, .ed select, .ed input[type=text] { font:12px inherit; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .sess textarea, .ed textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:6px; font:12.5px inherit; resize:vertical; margin-top:6px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:11px; font-size:11px; font-weight:600; background:#e7eef7; color:#3a5a80; }
  .pill.interactive { background:#e3f0e3; color:#356b35; } .pill.static { background:#f3e8dc; color:#8a5a2b; } .pill.text { background:#ece7f2; color:#5b4b82; }
  #saved { font-size:11px; color:var(--muted); margin-left:auto; }
  .ed { border:1px solid var(--accent); border-radius:10px; padding:10px; margin-top:10px; background:#fffdfa; }
  .ed .r { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; flex-wrap:wrap; }
  .ed .r > span:first-child { width:52px; color:var(--muted); }
  .ed .r select { flex:1; min-width:0; max-width:100%; }
  .ed input.tm { width:78px; font:12px ui-monospace,Menlo,monospace; }
  /* screenshot with focus boxes: drag on the frame to box the part of the artifact they focus on */
  .shotwrap { position:relative; width:100%; margin-top:6px; background:#eee9df; border-radius:6px; overflow:visible; cursor:crosshair; user-select:none; }
  .shotwrap img { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; border-radius:6px; }
  .fbox { position:absolute; border:2px solid #ff3d00; background:rgba(255,61,0,.12); box-shadow:0 0 0 1px rgba(255,255,255,.7); }
  .fbox span { position:absolute; left:-2px; top:-15px; background:#ff3d00; color:#fff; font-size:10px; font-weight:700; padding:0 4px; border-radius:3px 3px 0 0; line-height:13px; }
  .fbox b { position:absolute; right:-9px; top:-9px; width:16px; height:16px; border-radius:50%; background:#2a2725; color:#fff; font-size:11px; line-height:16px; text-align:center; cursor:pointer; }
  .fbox.tmp span, .fbox.tmp b { display:none; }
  .srow .fc { font-size:11px; color:#c2410c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #zoom { position:fixed; inset:0; background:rgba(20,18,16,.8); z-index:30; display:none; align-items:center; justify-content:center; padding:24px; }
  #zoom.open { display:flex; }
  #zoom .zb { background:var(--panel); border-radius:10px; padding:12px 14px; width:min(1400px, 96vw); max-height:96vh; overflow:auto; }
  #zoom .zb .r { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:13px; }
  /* marker pins: a moment, not a span */
  #tlPins { height:18px; }
  /* markers get their own lane under the process bar — they annotate the process, they aren't part of it */
  #tlMarks { height:18px; margin-top:3px; border-top:1px dashed #e3d6c4; }
  #tlMarks::before { content:"markers"; position:absolute; left:2px; top:3px; font-size:9px; color:#b9ab97; pointer-events:none; }
  .mkrow { display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin:-2px 0 10px; padding-top:5px; border-top:1px dashed #e3d6c4; }
  .mkrow .mkl { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; margin-right:2px; }
  .mkrow .pinchip { margin:0; }
  .mkrow .pinchip small { font-style:normal; opacity:.8; margin-left:4px; font-variant-numeric:tabular-nums; }
  .pinm { position:absolute; top:1px; transform:translateX(-1px); height:16px; border-left:2px solid var(--pin); padding:0 4px 0 2px; font-size:9.5px; line-height:13px; color:#fff; white-space:nowrap; cursor:pointer; z-index:2; }
  .pinm span { background:var(--pin); border-radius:0 3px 3px 0; padding:0 4px; display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; vertical-align:top; }
  .pinm.sel span { box-shadow:0 0 0 2px #2a2725; }
  .pinm.node { border-left-color:#2a2725; }
  .pinm.node span { background:var(--c); color:var(--ink,#fff); font-weight:700; border-radius:0 2px 2px 0; }
  .pinchip { align-self:center; margin:0 4px 14px; font-size:11px; font-style:italic; color:#fff; background:var(--pin); border-radius:9px; padding:0 7px; white-space:nowrap; cursor:pointer; }
  .pinchip.sel { box-shadow:0 0 0 2px #2a2725; }
  .pinb { display:flex; align-items:center; gap:4px; padding:2px 8px 2px 3px; border-radius:11px; font-size:11.5px; cursor:pointer; border:1px solid transparent; background:#fbf1e4; color:var(--text); }
  .pinb:hover { border-color:var(--pin); }
  .pinb i { font-style:normal; font-weight:700; font-size:10px; color:#fff; background:var(--pin); border-radius:9px; min-width:16px; text-align:center; padding:0 4px; }
  .pinb:disabled { opacity:.45; cursor:not-allowed; }
  .srow.pinrow { padding:3px 5px 3px 10px; }
  .srow.pinrow .pk { font-size:12px; font-style:italic; color:var(--pin); font-weight:600; }
  .srow .nbx { background:var(--c); color:var(--ink,#fff); font-weight:700; font-size:11.5px; padding:1px 7px; border-radius:3px; }
  .slist { margin-top:12px; }
  .srow { display:flex; gap:8px; padding:5px; border-radius:7px; cursor:pointer; align-items:center; border:1px solid transparent; }
  .srow:hover { background:#f6f3ed; }
  .srow.sel { border-color:var(--accent); background:#fffdfa; }
  .srow img, .srow .ni { width:72px; height:40px; object-fit:cover; border-radius:4px; background:#eee9df; flex:none; }
  .srow .st { font-size:12px; font-weight:600; display:flex; align-items:center; gap:5px; }
  .srow .st i { font-style:normal; font-size:10px; color:#fff; background:var(--c); border-radius:8px; padding:0 5px; }
  .srow .tm { font:11px ui-monospace,Menlo,monospace; color:var(--muted); }
  .cue { display:flex; gap:8px; padding:3px 5px; border-radius:5px; cursor:pointer; font-size:12.5px; }
  .cue:hover { background:#f6f3ed; }
  .cue.now { background:#fdf0e0; }
  .cue .t { font:11px ui-monospace,Menlo,monospace; color:var(--muted); flex:none; padding-top:1px; }
  .cue .sp { font-weight:600; }
  .cue.out { opacity:.5; }
  .trbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; position:sticky; top:-12px; background:var(--panel); padding:4px 0; z-index:1; }
  .trbar input[type=search] { flex:1; padding:4px 8px; border:1px solid var(--line); border-radius:6px; font:12px inherit; }
  .trbar label { font-size:11px; color:var(--muted); display:flex; gap:4px; align-items:center; white-space:nowrap; }
  .syncbox { background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; }
  .syncbox .r { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; align-items:center; }
  .arow { border:1px solid var(--line); border-radius:8px; padding:7px 8px; margin-top:8px; }
  .arow .hd { display:flex; align-items:center; gap:6px; font-size:12px; }
  .arow .hd b { background:#2a2725; color:#fff; border-radius:3px; padding:0 5px; font-size:10.5px; }
  .arow .hd .tt { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .arow .hd a { color:var(--accent); text-decoration:none; }
  .arow .p { font-size:11.5px; color:#6f6a61; margin-top:3px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .arow .p::before { content:"↳ "; }
  .athumb { position:relative; width:100%; aspect-ratio:4/3; overflow:hidden; background:#f2efe8; border-radius:5px; margin-top:6px; }
  .athumb iframe { position:absolute; top:0; left:0; width:1280px; height:960px; border:0; transform-origin:0 0; pointer-events:none; background:#fff; }
  .trow { font-size:11.5px; color:#6f6a61; padding:4px 6px; margin-top:6px; border-left:3px solid #d8d3c9; cursor:pointer; }
  .trow:hover { border-left-color:var(--accent); }
  .trow .tm, .arow .tm { font:11px ui-monospace,Menlo,monospace; color:var(--muted); }
  .banner { background:#fdf6e9; border:1px solid #ecd3a3; border-radius:8px; padding:8px 10px; font-size:12.5px; margin-bottom:10px; }
  .help { font-size:11.5px; color:var(--muted); line-height:1.7; margin-top:14px; }
  /* ---- compare board: every coder on one shared time axis, replaces timeline + sequence ---- */
  #cmpboard { display:none; flex:none; max-height:58%; overflow-y:auto; background:var(--panel); border-bottom:1px solid var(--line); padding:6px 12px 10px; user-select:none; }
  #center.cmp #palette, #center.cmp #tlwrap, #center.cmp #seqpanel { display:none; }
  /* compare mode: a smaller video, the board takes the rest of the column */
  #center.cmp #cmpboard { display:block; flex:1 1 auto; max-height:none; min-height:0; }
  #center.cmp #vwrap { flex:0 0 32%; min-height:150px; }
  #center.cmp #ctlHint { display:none; }
  .cb-head { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-bottom:4px; flex-wrap:wrap; }
  .cb-head .stat { font-size:12px; color:var(--text); }
  .cb-head .stat b { font-variant-numeric:tabular-nums; }
  .cb-grid { display:grid; grid-template-columns:86px 1fr; column-gap:8px; position:relative; }
  .cb-grid .lbl { font-size:11.5px; font-weight:700; text-align:right; padding-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .tseq { display:flex; flex-wrap:wrap; align-items:flex-end; row-gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:8px; }

  #figz.open { display:flex; }
  #figz .fb { background:#fff; border-radius:10px; padding:14px; width:min(1100px, 96vw); }

  .chunkband { position:absolute; top:3px; bottom:3px; border-radius:3px; font-size:9.5px; color:#fff; font-weight:700; padding:0 4px; line-height:18px; overflow:hidden; white-space:nowrap; cursor:pointer; }
  .chunkband.i { background:#9a8cc4; } .chunkband.e { background:#7fb38c; }

  .prow.pending .muted { margin-left:6px; }
</style>

<body>

    <input type="text" id="coder" spellcheck="false" placeholder="your name" /></label>
  <label title="Show other coders' segments and sequences for this session."><input type="checkbox" id="compare" /> compare coders</label>
  <span class="grow"></span>
  <button class="linkbtn" id="csvSeg" title="One row per node, process segment and marker, every coder">⭳ segments CSV</button>
  <button class="linkbtn" id="csvSeq" title="One row per (coder, session): the derived sequence">⭳ sequences CSV</button>
  <button class="linkbtn" id="csvTurns" title="One row per turn slot (intent / node / engagement step), every coder">⭳ turns CSV</button>
  <button class="linkbtn" id="refresh" title="Re-read sessions and the Drive folder">↻ refresh</button>
  <a href="/artifact-review">Artifact review →</a>

        <label style="text-transform:none;letter-spacing:0;font-weight:400;display:flex;gap:4px;align-items:center">group by
          <select id="groupBy" style="font:12px inherit;padding:1px 4px;border:1px solid var(--line);border-radius:6px;background:#fff">
            <option value="art">artifact</option><option value="loop">loop</option><option value="none">none</option></select></label></div>

<!-- frame grabber: must stay rendered (not display:none) or Chrome may never decode its frames -->
<video id="grab" preload="auto" muted playsinline style="position:fixed;left:0;bottom:0;width:4px;height:4px;opacity:.01;pointer-events:none"></video>

<script>
// ---- codebook: Pirolli & Card (2005) sensemaking loop, numbered as in their figure ----------
// node = a box in the figure (a data structure: 1, 4, 7, 10, 13, 16). Nodes are coded as PINS — a
// moment, usually something the LLM/artifact hands the participant, e.g. "schema (artifact 1)".
// The arrows between them are processes, coded as SEGMENTS (a span of activity).
// loop F = foraging loop, S = sensemaking loop. Node colors follow the figure.
const STAGES = [
  { n: 1, name: "External data sources", loop: "F", node: true, c: "#1f6fb2" },
  { n: 2, name: "Search & filter", loop: "F", c: "#3d7fc4" },
  { n: 3, name: "Search for information", loop: "F", c: "#5aa0d8" },
  { n: 4, name: "Shoebox", loop: "F", node: true, c: "#2e8b3a" },
  { n: 5, name: "Read & extract", loop: "F", c: "#2a9d8f" },
  { n: 6, name: "Search for relations", loop: "F", c: "#57b38a" },
  { n: 7, name: "Evidence file", loop: "F", node: true, c: "#d9b80f", ink: "#2a2725" },
  { n: 8, name: "Schematize", loop: "S", c: "#c9a227" },
  { n: 9, name: "Search for evidence", loop: "S", c: "#d98b5f" },
  { n: 10, name: "Schema", loop: "S", node: true, c: "#ef7d1a" },
  { n: 11, name: "Build case", loop: "S", c: "#c06c84" },
  { n: 12, name: "Search for support", loop: "S", c: "#a0698f" },
  { n: 13, name: "Hypothesis", loop: "S", node: true, c: "#d7262c" },
  { n: 14, name: "Tell story", loop: "S", c: "#7d6bb3" },
  { n: 15, name: "Reevaluate", loop: "S", c: "#8a7a5c" },
  { n: 16, name: "Presentation", loop: "S", node: true, c: "#6a2a6e" },
];
const ST = Object.fromEntries(STAGES.map((s) => [s.n, s]));
// Marker pins (independent of stage segments). key = keyboard shortcut.
const MARKS = [["narrowing", "n"], ["revisiting artifact", "r"], ["cross-checking", "c"], ["backtracking", "b"], ["comparing", "m"]];
const LABELS = [["", "— unlabeled", "#d8d3c9"], ["good", "Good / strong", "#5aae5e"], ["average", "Average / mediocre", "#e0b84a"], ["poor", "Non-informative", "#e57373"]];
const LABEL_C = Object.fromEntries(LABELS.map(([k, , c]) => [k, c]));
const COND = { I: "interactive", S: "static", T: "text" };
const TASK_SHORT = { relocation: "relocation", studytool: "study tool", userchoice: "user choice" };

// ---- tiny utils ----
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const fmt = (t, dec) => {
  if (t == null || !isFinite(t)) return "—";
  const neg = t < 0; t = Math.abs(t);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const ss = dec ? s.toFixed(1).padStart(4, "0") : String(Math.floor(s)).padStart(2, "0");
  return (neg ? "−" : "") + (h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`);
};
const parseTime = (s) => {
  if (!String(s ?? "").trim()) return null;
  const p = String(s).trim().split(":").map(Number);
  if (!p.length || p.some((x) => !isFinite(x))) return null;
  return p.reduce((a, x) => a * 60 + x, 0);
};
const r1 = (t) => Math.round(t * 10) / 10;
const uid = () => Math.random().toString(36).slice(2, 9);
const isNode = (n) => !!ST[n]?.node;
// a node pin's source: the participant (src "participant"), or an artifact — explicit pick (n),
// explicitly none (0), or automatic (null) = current artifact
const byParticipant = (p) => p.src === "participant";
const nodeArt = (p, pid, task) => (byParticipant(p) || p.art === 0 ? null : p.art ?? currentArtifact(p.t, pid, task));
const isMarker = (p) => !p.stage; // a pin is either a node (has stage) or a marker (has kind)
const pinLabel = (p) => (p.stage ? stageLabel(p) : p.kind);
const stageLabel = (g, pid, task) => {
  const s = ST[g.stage];
  if (!s) return "?";
  const art = g.t0 === undefined ? nodeArt(g, pid, task) : g.art;
  const a = g.t0 === undefined && byParticipant(g) ? " (participant)" : art != null ? ` (artifact ${art})` : "";
  return s.name.toLowerCase() + a;
};

// ---- state ----
const q = new URLSearchParams(location.search);
const state = {
  coder: (q.get("coder") || lsGet("pr-coder") || "").replace(/[^A-Za-z0-9_-]/g, ""),
  pid: q.get("pid") || "", task: q.get("task") || "",
  view: lsGet("pr-view") || "task", tab: "segs", compare: q.get("compare") === "1",
  mode: lsGet("pr-mode") || "turns", // "turns" (chunked per prompt) or "timeline" (segments + pins)
  sel: null, // selected segment id
  selPin: null, // selected marker pin id
};
let D = null; // { videos, sessions, scenarios }
let CODES = {}; // "pid|task" -> { coder -> record }
let SYNC = {}; // pid -> { videoStart, by }
let VTT = {}; // pid -> cues[]
const vid = $("vid");

function syncUrl() {
  const p = new URLSearchParams();
  for (const k of ["coder", "pid", "task"]) if (state[k]) p.set(k, state[k]);
  if (state.compare) p.set("compare", "1");
  history.replaceState(null, "", "?" + p);
}
async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} → ${r.status}`);
  return r.json();
}

// Videos stream straight from Drive through a service worker (public/process-sw.js) when it's active;
// otherwise /api/drive/<id> is served by the server proxy. ?s= gives the worker the file size.
const swReady = !("serviceWorker" in navigator) ? Promise.resolve(false) :
  navigator.serviceWorker.register("/process-sw.js", { scope: "/process-review" })
    .then(() => (navigator.serviceWorker.controller ? true : new Promise((res) => {
      navigator.serviceWorker.addEventListener("controllerchange", () => res(true), { once: true });
      setTimeout(() => res(!!navigator.serviceWorker.controller), 3000);
    })))
    .catch(() => false);
const videoSrc = (v) => `/api/drive/${v.videoId}${v.size ? `?s=${v.size}` : ""}`;

// ---- data ----
async function load(fresh) {
  await swReady;
  $("hdr").textContent = "loading…";
  let d, c;
  try {
    [d, c] = await Promise.all([getJson("/api/process-review" + (fresh ? "?fresh=1" : "")), getJson("/api/process-codes")]);
  } catch (e) {
    $("hdr").textContent = "failed to load: " + e.message;
    return;
  }
  D = d;
  CODES = {}; SYNC = {};
  for (const x of Object.values(c)) {
    if (x?.type === "sync") SYNC[x.pid] = x;
    else if (x?.coder && x?.pid && x?.task) {
      x.segs ||= []; x.pins ||= []; x.turns ||= {}; x.start ||= { hyp: null, note: "" };
      for (const g of x.segs) { for (const m of g.marks || []) x.pins.push({ id: uid(), t: g.t0, kind: m, note: "" }); delete g.marks; }
      // nodes used to be segments: turn them into pins, giving their span to the previous segment
      x.segs = x.segs.filter((g, i, l) => {
        if (!isNode(g.stage)) return true;
        x.pins.push({ id: g.id, t: g.t0, stage: g.stage, art: g.art ?? null, kind: "", note: g.note || "", shot: g.shot ?? null });
        if (i && l[i - 1].t1 === g.t0) l[i - 1].t1 = g.t1;
        return false;
      });
      x.pins.sort((a, b) => a.t - b.t);
      (CODES[`${x.pid}|${x.task}`] ||= {})[x.coder] = x;
    }
  }
  const n = Object.keys(D.videos).length;
  $("hdr").textContent = D.videoError ? `⚠ Drive: ${D.videoError}` : `${n} recordings`;
  renderSide();
  if (state.pid && D.videos[state.pid]) openSession(state.pid, state.task, true);
  else showEmpty();
}

// Sessions for one recording: the pid's study tasks (scenario task first), or the task in the
// file name when no study data exists for that pid.
function sessionsFor(pid) {
  const v = D.videos[pid];
  const list = D.sessions.filter((s) => s.pid === pid);
  if (!list.length && v) list.push({ pid, cond: COND[pid[0]] || "", task: v.task, artifacts: [], turns: [] });
  const order = (t) => (t === "userchoice" ? 1 : 0);
  return list.sort((a, b) => order(a.task) - order(b.task));
}
const cur = () => D && sessionsFor(state.pid).find((s) => s.task === state.task);
const recOf = (pid, task, coder) => CODES[`${pid}|${task}`]?.[coder] || null;
function mine(create) {
  if (!state.coder) return null;
  const k = `${state.pid}|${state.task}`;
  let r = CODES[k]?.[state.coder];
  if (!r && create) r = (CODES[k] ||= {})[state.coder] = { coder: state.coder, pid: state.pid, task: state.task, segs: [], pins: [], label: "", note: "" };
  return r;
}
const segs = () => mine()?.segs || [];
const pins = () => mine()?.pins || [];

// Video ↔ wall clock. Every recording has Zoom's date/time stamp burned into its bottom-right
// corner, so a coder reads it once per recording (Events tab) and that sync is shared per pid.
// Unsynced recordings show the whole video and no prompt/artifact markers.
// The burned-in clocks are the study machines' local time (Pacific); read and show times in that zone.
const TZ = "America/Los_Angeles";
const tzOffset = (ms) => { const d = new Date(ms); return Date.parse(d.toLocaleString("en-US", { timeZone: TZ }) + " UTC") - Date.parse(d.toLocaleString("en-US", { timeZone: "UTC" }) + " UTC"); };
const parseTz = (iso) => { const g = Date.parse(iso.replace(" ", "T") + "Z"); return isNaN(g) ? null : g - tzOffset(g); };
const tzDay = (ms) => new Date(ms).toLocaleDateString("en-CA", { timeZone: TZ });
const tzTime = (ms) => new Date(ms).toLocaleTimeString("en-GB", { timeZone: TZ });
// A recording shared by back-to-back sessions (e.g. T4-tool_T5-tool) has one start time, so a
// pid without its own sync borrows its partner's.
const syncOf = (pid) => SYNC[pid] || (D?.videos[pid]?.sharedWith || []).map((x) => SYNC[x]).find(Boolean);
const videoStart = (pid) => syncOf(pid)?.videoStart ?? null;
const vt = (ts, pid = state.pid) => { const s = videoStart(pid); return s == null ? null : (Date.parse(ts) - s) / 1000; };
const duration = () => (isFinite(vid.duration) && vid.duration) || (D.videos[state.pid]?.durationMs || 0) / 1000;
// A task's span in the video: from a few minutes before its first prompt/artifact until the next task
// of the recording begins (participants keep exploring, reflecting and talking after their last prompt),
// or 15 min after its last event for the final task. Always widened to cover what's been coded.
const eventSpan = (s) => {
  const ts = [...s.turns.map((t) => t.ts), ...s.artifacts.map((a) => a.ts)].map((x) => vt(x, s.pid)).filter((x) => x != null && isFinite(x));
  return ts.length ? [Math.min(...ts), Math.max(...ts)] : null;
};
const LEAD = 300;
function taskWindow(s = cur()) {
  const dur = s && s.pid !== state.pid ? (D.videos[s.pid]?.durationMs || 0) / 1000 : duration();
  if (!s) return [0, dur];
  const span = eventSpan(s);
  if (!span) return [0, dur];
  const later = sessionsFor(s.pid).map(eventSpan).filter((x) => x && x[0] > span[1]).map((x) => x[0]);
  let a = Math.max(0, span[0] - LEAD);
  let b = later.length ? Math.max(span[1] + 60, Math.min(...later) - LEAD) : span[1] + 900;
  // never cut off what's already coded in this session (any coder)
  for (const r of Object.values(CODES[`${s.pid}|${s.task}`] || {})) {
    for (const g of r.segs || []) { a = Math.min(a, g.t0); b = Math.max(b, (g.t1 ?? g.t0) + 30); }
    for (const p of r.pins || []) { a = Math.min(a, p.t); b = Math.max(b, p.t + 30); }
  }
  a = Math.max(0, a); b = Math.min(dur || Infinity, b);
  return b > a ? [a, b] : [0, dur];
}
function viewWindow() {
  const dur = duration();
  if (state.view === "full") return [0, dur || 1];
  if (state.view === "zoom") {
    const t = vid.currentTime || 0, span = Math.min(600, dur || 600);
    const a = Math.max(0, Math.min(t - span / 2, (dur || span) - span));
    return [a, a + span];
  }
  const [a, b] = taskWindow();
  return [a, b > a ? b : a + 60];
}

// ---- sidebar ----
function renderSide() {
  const byNum = (a, b) => a[0].localeCompare(b[0]) || +a.slice(1) - +b.slice(1);
  const pids = Object.keys(D.videos).sort(byNum);
  const pending = (D.pending || []).filter((x) => !D.videos[x]).sort(byNum);
  let h = "";
  for (const p of ["I", "S", "T"]) {
    const ps = pids.filter((x) => x[0] === p), wait = pending.filter((x) => x[0] === p);
    if (!ps.length && !wait.length) continue;
    h += `<h3>${COND[p]} (${ps.length}${wait.length ? ` + ${wait.length} pending` : ""})</h3>`;
    // Transcript in Drive but no video yet — shown so it's clear they're coming, not missing.
    for (const pid of wait) h += `<div class="prow pending" title="Transcript is in Drive; the video isn't yet. Use ↻ refresh once it has uploaded."><b>${pid}</b><span class="muted">video pending</span></div>`;
    for (const pid of ps) {
      const shared = D.videos[pid]?.sharedWith;
      h += `<div class="prow"><b${shared?.length ? ` title="Same recording as ${esc(shared.join(", "))}"` : ""}>${pid}${shared?.length ? "⁺" : ""}</b>` + sessionsFor(pid).map((s) => {
        const r = recOf(pid, s.task, state.coder);
        const others = Object.keys(CODES[`${pid}|${s.task}`] || {}).filter((c) => c !== state.coder).length;
        const on = pid === state.pid && s.task === state.task ? " on" : "";
        return `<span class="tchip${on}" data-pid="${pid}" data-task="${esc(s.task)}" title="${esc(s.task)}${others ? ` · ${others} other coder(s)` : ""}">
          <span class="dot" style="background:${LABEL_C[r?.label || ""]}"></span>${esc(TASK_SHORT[s.task] || s.task)}${r?.segs?.length ? `<span class="n">${r.segs.length}</span>` : ""}</span>`;
      }).join("") + "</div>";
    }
  }
  h += `<div class="legend">${LABELS.map(([k, l, c]) => `<div><i style="background:${c}"></i>${esc(l)}</div>`).join("")}<div style="margin-top:4px">number = your segments</div></div>`;
  $("side").innerHTML = h;
}
$("side").addEventListener("click", (e) => {
  const c = e.target.closest(".tchip");
  if (c) openSession(c.dataset.pid, c.dataset.task);
});

function showEmpty() {
  $("vmsg").style.display = "flex";
  $("vmsg").textContent = D?.videoError ? "Could not read the Drive folder: " + D.videoError : "Pick a session on the left.";
  renderAll();
}

// ---- open a session ----
let posTimer = null;
function openSession(pid, task, fromUrl) {
  const prevPid = state.pid;
  const list = sessionsFor(pid);
  state.pid = pid;
  state.task = list.find((s) => s.task === task)?.task || list[0]?.task || "";
  state.sel = null; state.selTurn = null;
  syncUrl();
  renderSide();
  const v = D.videos[pid];
  const tParam = fromUrl ? parseTime(q.get("t") || "") : null;
  const goStart = () => {
    const [a, b] = taskWindow();
    const saved = +lsGet(`pr-pos-${pid}-${state.task}`);
    seek(tParam ?? (saved && saved >= a && saved <= b ? saved : a));
  };
  if (pid !== prevPid || !vid.src) {
    $("vmsg").style.display = "flex";
    $("vmsg").textContent = "Loading video from Drive…";
    vid.src = videoSrc(v);
    $("grab").src = vid.src;
    for (const t of [...vid.querySelectorAll("track")]) t.remove();
    if (v.vttId) {
      const tr = document.createElement("track");
      Object.assign(tr, { kind: "captions", label: "Transcript", srclang: "en", src: `/api/drive/${v.vttId}` });
      vid.appendChild(tr);
      tr.track.mode = ccOn ? "showing" : "hidden";
    }
    vid.addEventListener("loadedmetadata", () => { goStart(); renderAll(); }, { once: true });
    loadVtt(pid);
  } else goStart();
  renderAll();
}
function seek(t) {
  const d = duration();
  vid.currentTime = Math.max(0, d ? Math.min(t, d - 0.05) : t);
  updatePlayhead();
}

const pct = (t, [a, b]) => ((t - a) / (b - a)) * 100;
function effEnd(list, i) { return list[i].t1 ?? list[i + 1]?.t0 ?? null; }
function segEls(list, w, withHandles) {
  const now = vid.currentTime || 0;

    const s = ST[g.stage] || { c: "#999", name: "?" };
    let end = effEnd(list, i);
    const open = end == null;
    if (open) end = Math.max(g.t0 + 3, now > g.t0 ? now : g.t0 + 3);
    const l = pct(g.t0, w), r = pct(end, w);
    if (r < 0 || l > 100) return "";
    const L = Math.max(0, l), W = Math.max(0.15, Math.min(100, r) - L);
    const sel = withHandles && g.id === state.sel;
    return `<div class="seg${open ? " open" : ""}${sel ? " sel" : ""}" data-id="${g.id}" style="--c:${s.c};left:${L}%;width:${W}%"
      title="${esc(`${g.stage} ${s.name}${g.art != null ? ` · artifact ${g.art}` : ""}\n${fmt(g.t0)}–${open ? "…" : fmt(end)}${g.note ? "\n" + g.note : ""}`)}">${withHandles ? `${g.stage} ${esc(s.name)}` : ""}${sel ? `<span class="h h0" data-h="0"></span>${g.t1 != null ? '<span class="h h1" data-h="1"></span>' : ""}` : ""}</div>`;

}
function renderTimeline() {

  const width = $("tl").clientWidth || 800;
  const step = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600].find((s) => (s / span) * width >= 70) || 3600;
  let h = "";
  for (let t = Math.ceil(w[0] / step) * step; t <= w[1]; t += step) h += `<span style="left:${pct(t, w)}%">${fmt(t)}</span>`;
  $("tlRuler").innerHTML = h;
  // task bands (both tasks of this recording), artifacts, prompts
  const s = cur();
  let ev = "";
  for (const ss of sessionsFor(state.pid)) {
    if (ss.task !== state.task && state.view === "task") continue;
    const [a, b] = taskWindow(ss);
    if (b > a) ev += `<div class="taskband" style="left:${Math.max(0, pct(a, w))}%;width:${Math.max(0, Math.min(100, pct(b, w)) - Math.max(0, pct(a, w)))}%;${ss.task !== state.task ? "background:rgba(0,0,0,.03);border-color:#ccc" : ""}" title="${esc(ss.task)}"></div>`;
  }
  for (const ss of sessionsFor(state.pid)) {

    for (const t of ss.turns) {

      if (x == null || x < w[0] || x > w[1]) continue;
      ev += `<div class="ev turn" style="left:${pct(x, w)}%;${dim}" data-t="${x}" title="${esc(`${fmt(x)} · prompt (${ss.task}):\n${t.user}`)}"></div>`;
    }
    for (const a of ss.artifacts) {
      const x = vt(a.ts);
      if (x == null || x < w[0] || x > w[1]) continue;
      ev += `<div class="ev art" style="left:${pct(x, w)}%;${dim}" data-t="${x}" title="${esc(`${fmt(x)} · artifact ${a.seq} (${ss.task}): ${a.title || ""}\n↳ ${a.prompt || ""}`)}">${a.seq}</div>`;

    `<div class="pinm${p.stage ? " node" : ""}${p.id === state.selPin ? " sel" : ""}" data-pin="${p.id}" style="left:${pct(p.t, w)}%;${p.stage ? `--c:${ST[p.stage].c};${ST[p.stage].ink ? `--ink:${ST[p.stage].ink}` : ""}` : ""}" title="${esc(`${fmt(p.t)} · ${pinLabel(p)}${p.note ? "\n" + p.note : ""}`)}"><span>${p.stage ? `${p.stage} ${esc(ST[p.stage].name.toLowerCase())}${byParticipant(p) ? " · P" : nodeArt(p) != null ? " · a" + nodeArt(p) : ""}` : esc(p.kind)}</span></div>`;

  $("tlPins").innerHTML = state.mode === "turns" ? "" : inView.filter((p) => !isMarker(p)).map(pinEl).join("");
  $("tlMarks").innerHTML = inView.filter(isMarker).map(pinEl).join("");
  $("tlSegs").innerHTML = state.mode === "turns" ? chunkBands(w) : state.coder ? segEls(segs(), w, true) : `<div style="font-size:11px;color:var(--muted);padding:7px">Enter a coder name to annotate.</div>`;
  // other coders

    if (c === state.coder || !r.segs?.length) continue;
    o += `<div class="tlrow orow" title="${esc(c)}">${segEls(r.segs, w, false)}</div>`;
  }

}

// ---- turns view ----------------------------------------------------------------------------
// Each prompt is one turn, chunked automatically from the logs:
//   ① intent  = typing the prompt + the reflection overlay about it (from when the overlay opened,
//               or an estimate when only its close is logged) until the reply is visible,
//   ② node    = the artifact (or, text condition, the AI reply) as it appears,
//   ③ engage  = from then until the next turn's intent starts.
// Reflection Q1/Q2 look back at the previous artifact, so the next overlay is offered as a
// "look-back" clip in ③. Coders tag: one intent edge (+ possible alternatives), the node and who
// led to it, and the engagement steps (edges, plus participant-led nodes for the edge case of a
// hypothesis formed while engaging). Stored per coder in r.turns, keyed by the prompt's log time.

function deriveTurns(s = cur(), rec = mine()) {

// Every coder of this session on one time axis: a lane each (nodes · process segments · markers),
// with an agreement strip under each other coder showing, second by second, whether their stage
// matches the reference coder's (you, or the first coder). Details + disagreements: Compare tab.
const cmpCoders = () => {
  const all = Object.entries(CODES[`${state.pid}|${state.task}`] || {}).filter(([, r]) => r.segs?.length || r.pins?.length);
  return all.sort(([a], [b]) => (a === state.coder ? -1 : b === state.coder ? 1 : a.localeCompare(b)));

  if (!ts.length) return null;
  const sg = r.segs || [];

  }
  return h + "</div>";
}

// ---- reference figure: Pirolli & Card's sensemaking loop, redrawn with this tool's colors ----
function figureSvg(W = 330) {
  const nodes = [1, 4, 7, 10, 13, 16], bw = 128, bh = 30, dx = 106, dy = 60, H = 6 * dy + 40, ox = 104;
  const pos = (j) => ({ x: ox + j * dx, y: H - 44 - j * dy });
  let g = "";
  nodes.forEach((n, j) => {
    if (j === nodes.length - 1) return;
    const a = pos(j), b = pos(j + 1), up = n + 1, down = n + 2; // e.g. 1 →2→ 4 and 4 →3→ 1
    // forward: right side of the lower box → up into the upper box
    g += `<path d="M${a.x + bw} ${a.y + 12} H${b.x + 70} V${b.y + bh + 2}" fill="none" stroke="${ST[up].c}" stroke-width="2" marker-end="url(#ah)"/>
      <text x="${b.x + 75}" y="${a.y + 4}" font-size="9.5" fill="${ST[up].c}" font-weight="700">${up}. ${esc(ST[up].name)}</text>`;
    // back: left side of the upper box → down into the lower box
    g += `<path d="M${b.x} ${b.y + 20} H${a.x + 30} V${a.y - 2}" fill="none" stroke="${ST[down].c}" stroke-width="2" marker-end="url(#ah)"/>
      <text x="${a.x + 26}" y="${b.y + 34}" font-size="9.5" fill="${ST[down].c}" font-weight="700" text-anchor="end">${down}. ${esc(ST[down].name)}</text>`;
  });
  // 16 → 15 → 13 (reevaluate) loops back from presentation
  nodes.forEach((n, j) => {
    const p = pos(j), s = ST[n];
    g += `<rect x="${p.x}" y="${p.y}" width="${bw}" height="${bh}" rx="3" fill="${s.c}"/><text x="${p.x + bw / 2}" y="${p.y + 19}" font-size="10.5" font-weight="700" fill="${s.ink || "#fff"}" text-anchor="middle">${n}. ${esc(s.name)}</text>`;
  });
  g += `<text x="${pos(1).x + bw + 70}" y="${H - 12}" font-size="11" font-style="italic" fill="#8a857c">foraging loop (1 → 7)</text>
    <text x="${pos(4).x + 20}" y="${pos(1).y + 20}" font-size="11" font-style="italic" fill="#8a857c">sensemaking loop (7 → 16)</text>`;
  const vw = ox + 5 * dx + bw + 70;
  return `<svg viewBox="0 0 ${vw} ${H}" width="100%" style="max-width:${W}px;display:block;margin:auto" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#555"/></marker></defs>${g}</svg>`;
}
const figureHtml = () => `<div class="figref" id="figRef" title="Click to enlarge"><div class="cap">Reference: sensemaking loop (Pirolli &amp; Card 2005), redrawn · click to enlarge</div>${figureSvg(330)}</div>`;
document.addEventListener("click", (e) => {
  if (e.target.closest("#figRef")) { $("figzBox").innerHTML = figureSvg(1060) + '<div class="muted" style="font-size:12px;margin-top:6px;text-align:center">Nodes (boxes) are data structures; numbered arrows are processes. Climbing = more structure, more effort. Click anywhere to close.</div>'; $("figz").classList.add("open"); return; }
  if (e.target.closest("#figz")) $("figz").classList.remove("open");
});

  if (row) return row.dataset.pin ? selectPin(row.dataset.pin, true) : selectSeg(row.dataset.id, true);
  const t = e.target;
  if (t.id === "eDel") return deleteSel();
  if (t.id === "eZoom") { state.zoom = true; return renderZoom(); }
  const pn = pins().find((x) => x.id === state.selPin);
  if (pn) {
    if (t.id === "eShot") return captureNow();
    if (t.id === "pTnow") pn.t = r1(vid.currentTime);
    else if (t.dataset.pnudge) pn.t = r1(Math.max(0, pn.t + +t.dataset.pnudge));
    else return;
    mine().pins.sort((a, b) => a.t - b.t); seek(pn.t); changed();

  const g = segs().find((x) => x.id === state.sel);
  if (!g) return;
  if (t.id === "eT0now") { g.t0 = r1(vid.currentTime); sortSegs(); changed(); }
  else if (t.id === "eT1now") { const v = r1(vid.currentTime); if (v > g.t0) { g.t1 = v; changed(); } }

    const list = segs(), i = list.indexOf(g);
    if (k === "t0") g.t0 = r1(Math.max(0, g.t0 + +d));
    else g.t1 = r1(Math.max(g.t0 + 0.5, (g.t1 ?? effEnd(list, i) ?? g.t0) + +d));

  }

    changed();

  else if (t.id === "eArt") { g.art = t.value === "" ? null : +t.value; changed(); }
  else if (t.id === "eT0" || t.id === "eT1") {

// Zoom's timestamp sits in the bottom-right corner of the frame: show it enlarged next to the input.
function drawClock() {
  const c = $("clockCrop");
  if (!c || !vid.videoWidth) return;
  const w = Math.round(vid.videoWidth * 0.2), h = Math.round(w * (56 / 420));
  try { c.getContext("2d").drawImage(vid, vid.videoWidth - w, vid.videoHeight - h, w, h, 0, 0, c.width, c.height); } catch {}
}
function syncFromClock() {
  const raw = $("clockIn").value.trim();
  const s = cur(), day = (s?.turns[0] || s?.artifacts[0])?.ts;
  const ms = /^\d{4}-\d\d-\d\d/.test(raw) ? parseTz(raw) : day && /^\d{1,2}:\d\d:\d\d$/.test(raw) ? parseTz(tzDay(Date.parse(day)) + " " + raw.padStart(8, "0")) : null;
  if (ms == null) { $("clockIn").style.borderColor = "#b3261e"; return; }
  setSync(ms - vid.currentTime * 1000, { clock: raw, at: r1(vid.currentTime) });
}
// Artifact previews: live iframes from the artifact HTML (srcdoc, as in /artifact-review), scaled from 1280px.
const htmlCache = new Map();
const getHtml = (file) => {
  if (!htmlCache.has(file)) htmlCache.set(file, fetch(file).then((r) => (r.ok ? r.text() : `<p style="font:14px sans-serif;color:#999;padding:20px">Could not load ${file}</p>`)));
  return htmlCache.get(file);
};
function scaleThumbs(root) {
  root.querySelectorAll("iframe[data-file]:not([srcdoc])").forEach((f) => getHtml(f.dataset.file).then((h) => { f.srcdoc = h; }));
  root.querySelectorAll(".athumb").forEach((t) => { const f = t.querySelector("iframe"); f.style.transform = `scale(${t.clientWidth / 1280})`; });
}
$("pEv").addEventListener("click", (e) => {
  const t = e.target;
  const row = t.closest(".trow");
  if (row) return seek(+row.dataset.t);
  if (t.dataset.seek != null) { e.preventDefault(); return seek(+t.dataset.seek); }
  if (t.dataset.shift) return setSync(videoStart(state.pid) - +t.dataset.shift * 1000, syncOf(state.pid));
  if (t.id === "clockSet") return syncFromClock();
});
$("pEv").addEventListener("keydown", (e) => { if (e.target.id === "clockIn" && e.key === "Enter") syncFromClock(); });
async function setSync(ms, extra) {
  // Same video for every pid on a shared recording, so the sync is saved for all of them.
  const pids = [state.pid, ...(D.videos[state.pid]?.sharedWith || [])];
  for (const pid of pids) SYNC[pid] = { type: "sync", pid, videoStart: Math.round(ms), by: state.coder, clock: extra?.clock || "", at: extra?.at ?? null };
  renderAll();
  try {
    for (const pid of pids) {
      const r = await fetch("/api/process-codes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sync: true, ...SYNC[pid], coder: state.coder }) });
      if (!r.ok) throw new Error(r.status);
    }
  } catch (e) { alert("Saving the sync failed: " + e.message); }
}

// ---- right panel: transcript (the recording's .vtt from Drive) ----
async function loadVtt(pid) {
  const v = D.videos[pid];
  if (!v?.vttId || VTT[pid]) return;
  VTT[pid] = [];
  try {
    const txt = await (await fetch(`/api/drive/${v.vttId}`)).text();
    const toS = (s) => { const [h, m, x] = s.trim().split(":"); return +h * 3600 + +m * 60 + parseFloat(x); };
    VTT[pid] = txt.split(/\r?\n\r?\n/).map((b) => {
      const lines = b.trim().split(/\r?\n/);
      const i = lines.findIndex((l) => l.includes("-->"));
      if (i < 0) return null;
      const [a, z] = lines[i].split("-->");
      const text = lines.slice(i + 1).join(" ");
      const m = text.match(/^([^:]{1,40}):\s*(.*)$/);
      return { t0: toS(a), t1: toS(z.split(" ").filter(Boolean)[0]), sp: m ? m[1] : "", text: m ? m[2] : text };
    }).filter(Boolean);
  } catch { VTT[pid] = null; }
  if (pid === state.pid) renderTr(true);
}
let trQuery = "", trFollow = true, trTaskOnly = true, lastCue = -1;
function renderTr(full) {
  const p = $("pTr");
  if (!D || !state.pid) { p.innerHTML = ""; return; }
  const cues = VTT[state.pid];
  if (full) {
    const bar = `<div class="trbar"><input type="search" id="trQ" placeholder="Search transcript…" value="${esc(trQuery)}" />
      <label><input type="checkbox" id="trTask"${trTaskOnly ? " checked" : ""}/> this task</label><label><input type="checkbox" id="trFollow"${trFollow ? " checked" : ""}/> follow</label></div>`;
    if (!D.videos[state.pid]?.vttId) { p.innerHTML = `<div class="empty">No transcript (.vtt) in Drive for ${esc(state.pid)}.</div>`; return; }
    if (cues == null) { p.innerHTML = `<div class="empty">Could not load the transcript.</div>`; return; }
    if (!cues.length) { p.innerHTML = bar + `<div class="empty">Loading transcript…</div>`; return; }
    const [a, b] = taskWindow(), qq = trQuery.toLowerCase();
    p.innerHTML = bar + cues.map((c, i) => {
      if (trTaskOnly && (c.t1 < a || c.t0 > b)) return "";
      if (qq && !(c.sp + " " + c.text).toLowerCase().includes(qq)) return "";
      return `<div class="cue" data-i="${i}" data-t="${c.t0}"><span class="t">${fmt(c.t0)}</span><span><span class="sp">${esc(c.sp)}</span>${c.sp ? ": " : ""}${esc(c.text)}</span></div>`;
    }).join("");
    lastCue = -1;
  }
  if (!cues?.length) return;
  const t = vid.currentTime || 0;
  let i = cues.findIndex((c) => c.t0 <= t && t < c.t1);
  if (i < 0) i = cues.findIndex((c) => c.t0 > t) - 1;
  if (i === lastCue) return;
  p.querySelector(".cue.now")?.classList.remove("now");
  const el = p.querySelector(`.cue[data-i="${i}"]`);
  if (el) { el.classList.add("now"); if (trFollow && state.tab === "tr" && !p.matches(":hover")) el.scrollIntoView({ block: "center" }); }
  lastCue = i;
}
$("pTr").addEventListener("click", (e) => { const c = e.target.closest(".cue"); if (c) seek(+c.dataset.t); });
$("pTr").addEventListener("input", (e) => { if (e.target.id === "trQ") { trQuery = e.target.value; renderTr(true); $("trQ").focus(); } });
$("pTr").addEventListener("change", (e) => {
  if (e.target.id === "trFollow") trFollow = e.target.checked;
  if (e.target.id === "trTask") { trTaskOnly = e.target.checked; renderTr(true); }
});

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  state.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  for (const [k, id] of [["segs", "pSegs"], ["tr", "pTr"], ["ev", "pEv"], ["cmp", "pCmp"]]) $(id).classList.toggle("on", k === state.tab);
  if (state.tab === "ev") scaleThumbs($("pEv"));
  if (state.tab === "tr") { lastCue = -1; renderTr(false); }
}));

// ---- player controls ----
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3];
$("speed").innerHTML = SPEEDS.map((s) => `<option value="${s}">${s}×</option>`).join("");
const setSpeed = (s) => { vid.playbackRate = s; $("speed").value = s; lsSet("pr-speed", s); };
setSpeed(+lsGet("pr-speed") || 1);
vid.addEventListener("loadedmetadata", () => setSpeed(+$("speed").value));
$("speed").addEventListener("change", () => setSpeed(+$("speed").value));
const togglePlay = () => (vid.paused ? vid.play() : vid.pause());
$("play").addEventListener("click", togglePlay);
$("back5").addEventListener("click", () => seek(vid.currentTime - 5));
$("fwd5").addEventListener("click", () => seek(vid.currentTime + 5));
let ccOn = lsGet("pr-cc") === "1";
const applyCc = () => { $("cc").classList.toggle("on", ccOn); for (const t of vid.textTracks) t.mode = ccOn ? "showing" : "hidden"; };
// volume (remembered per browser)
const applyVol = () => { $("vol").value = vid.muted ? 0 : vid.volume; $("mute").textContent = vid.muted || vid.volume === 0 ? "🔇" : vid.volume < 0.5 ? "🔉" : "🔊"; };
vid.volume = +(lsGet("pr-vol") ?? 1); vid.muted = lsGet("pr-muted") === "1"; applyVol();
$("vol").addEventListener("input", () => { vid.volume = +$("vol").value; vid.muted = vid.volume === 0; lsSet("pr-vol", vid.volume); lsSet("pr-muted", vid.muted ? "1" : "0"); applyVol(); });
$("mute").addEventListener("click", () => { vid.muted = !vid.muted; if (!vid.muted && vid.volume === 0) vid.volume = 0.5; lsSet("pr-muted", vid.muted ? "1" : "0"); lsSet("pr-vol", vid.volume); applyVol(); });
$("cc").addEventListener("click", () => { ccOn = !ccOn; lsSet("pr-cc", ccOn ? "1" : "0"); applyCc(); });
applyCc();
vid.addEventListener("loadeddata", () => ($("vmsg").style.display = "none"));
vid.addEventListener("play", updatePlayhead);
vid.addEventListener("pause", () => { updatePlayhead(); drawClock(); });
vid.addEventListener("error", () => { $("vmsg").style.display = "flex"; $("vmsg").textContent = "Could not load the video from Drive."; });
// While playing: move the playhead every frame; redraw the open segment, plot and transcript ~2×/s.
let lastSlow = 0;
(function tick(ts) {
  if (!vid.paused) {
    updatePlayhead();
    if (ts - lastSlow > 500) {
      lastSlow = ts;
      if (state.view === "zoom" || segs().some((g, i, l) => effEnd(l, i) == null)) renderTimeline();
      renderPlot();
      renderTr(false);
    }
  }
  requestAnimationFrame(tick);
})(0);
vid.addEventListener("seeked", () => { drawClock(); updatePlayhead(); if (state.view === "zoom") { renderTimeline(); renderCompare(); } renderPlot(); renderTr(false); });
setInterval(() => { if (state.pid && !vid.paused) lsSet(`pr-pos-${state.pid}-${state.task}`, vid.currentTime.toFixed(1)); }, 5000);
window.addEventListener("resize", () => { renderTimeline(); renderPlot(); scaleThumbs($("pEv")); });

// ---- keyboard ----
let numBuf = "", numT = null;
const flushNum = () => { clearTimeout(numT); if (numBuf) addStage(+numBuf); numBuf = ""; };
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!D || !state.pid) return;
  const k = e.code === "BracketRight" ? "]" : e.code === "BracketLeft" ? "[" : e.key;
  if (state.mode === "turns" && (/^\d$/.test(k) || ["[", "]", "ArrowUp", "ArrowDown", "Backspace", "Delete"].includes(k))) {
    if (k === "Backspace" || k === "Delete") { if (state.selPin) { e.preventDefault(); deleteSel(); } }
    return;
  }
  if (/^\d$/.test(k)) {
    // "1" waits briefly for a second digit (10–16); any other digit is a stage on its own.
    e.preventDefault();
    if (numBuf === "1") { numBuf += k; return flushNum(); }
    if (k === "1") { numBuf = "1"; numT = setTimeout(flushNum, 700); return; }
    numBuf = k; return flushNum();
  }
  const list = segs(), i = list.findIndex((g) => g.id === state.sel);
  const map = {
    " ": togglePlay,
    ArrowLeft: () => seek(vid.currentTime - (e.shiftKey ? 1 : 5)),
    ArrowRight: () => seek(vid.currentTime + (e.shiftKey ? 1 : 5)),
    ArrowUp: () => list.length && selectSeg(list[Math.max(0, i < 0 ? list.length - 1 : i - 1)].id, true),
    ArrowDown: () => list.length && selectSeg(list[Math.min(list.length - 1, i + 1)].id, true),
    "]": closeAt,
    "[": () => { const g = list[i]; if (g) { g.t0 = r1(vid.currentTime); sortSegs(); changed(); } },
    x: captureNow, X: captureNow,
    ...Object.fromEntries(MARKS.flatMap(([m, k]) => [[k, () => addPin(m)], [k.toUpperCase(), () => addPin(m)]])),
    Backspace: deleteSel, Delete: deleteSel,
    Escape: () => { if (state.zoom) { state.zoom = false; renderZoom(); return; } state.sel = null; state.selPin = null; state.selTurn = null; renderTimeline(); renderSeq(); renderPlot(); renderSegPane(); },
    "-": () => setSpeed(SPEEDS[Math.max(0, SPEEDS.indexOf(vid.playbackRate) - 1)] ?? 1),
    "=": () => setSpeed(SPEEDS[Math.min(SPEEDS.length - 1, SPEEDS.indexOf(vid.playbackRate) + 1)] ?? 1),
  };
  if (map[k]) { e.preventDefault(); map[k](); }
});

// ---- header ----
$("coder").value = state.coder;
$("coder").classList.toggle("missing", !state.coder);
$("coder").addEventListener("change", () => {
  state.coder = $("coder").value.replace(/[^A-Za-z0-9_-]/g, "").slice(0, 30);
  $("coder").value = state.coder;
  $("coder").classList.toggle("missing", !state.coder);
  lsSet("pr-coder", state.coder);
  state.sel = null;
  syncUrl(); renderSide(); renderAll();
});
$("compare").checked = state.compare;
$("compare").addEventListener("change", () => {
  state.compare = $("compare").checked;
  syncUrl();
  // the compare board replaces the timeline + sequence; its details live in the Compare tab
  if (!state.compare && state.tab === "cmp") document.querySelector('.tabs [data-tab="segs"]').click();
  renderAll();
});
$("refresh").addEventListener("click", () => load(true));

// ---- export ----
const csvEsc = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function download(name, rows) {
  const blob = new Blob([rows.map((r) => r.map(csvEsc).join(",")).join("\n")], { type: "text/csv" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}
function allRecs() {
  return Object.values(CODES).flatMap((m) => Object.values(m)).filter((r) => r.segs?.length || r.pins?.length || r.label || r.note)
    .sort((a, b) => a.coder.localeCompare(b.coder) || a.pid.localeCompare(b.pid, undefined, { numeric: true }) || a.task.localeCompare(b.task));
}
const condOf = (r) => D.sessions.find((s) => s.pid === r.pid && s.task === r.task)?.cond || COND[r.pid[0]] || "";
const boxesCsv = (o) => (o.boxes || []).map((b) => [b.x, b.y, b.w, b.h].join(",")).join("; ");
$("csvSeg").addEventListener("click", () => {
  // one row per segment and per marker pin (type column), in time order
  const rows = [["coder", "pid", "cond", "task", "session_label", "type", "idx", "start_s", "end_s", "dur_s", "start", "end", "stage_num", "stage", "loop", "is_node", "artifact", "marker", "focus", "focus_boxes", "screenshot_s", "note", "start_wallclock"]];
  // focus_boxes: "x,y,w,h" per box as fractions of the video frame at screenshot_s, ";"-separated
  for (const r of allRecs()) {
    const vs = videoStart(r.pid), wall = (t) => (vs != null ? new Date(vs + t * 1000).toISOString() : "");
    let n = 0;
    for (const it of seqItems(r)) {
      if (it.k === "p" && isMarker(it.p)) { const p = it.p; rows.push([r.coder, r.pid, condOf(r), r.task, r.label, "marker", "", p.t, "", "", fmt(p.t, true), "", "", "", "", "", "", p.kind, "", "", "", p.note, wall(p.t)]); continue; }
      if (it.k === "p") { const p = it.p, s = ST[p.stage] || {}; rows.push([r.coder, r.pid, condOf(r), r.task, r.label, "node", ++n, p.t, "", "", fmt(p.t, true), "", p.stage, s.name, s.loop === "F" ? "foraging" : "sensemaking", 1, byParticipant(p) ? "participant" : nodeArt(p, r.pid, r.task) ?? "", "", p.focus || "", boxesCsv(p), shotT(p), p.note, wall(p.t)]); continue; }
      const g = it.g, i = r.segs.indexOf(g), s = ST[g.stage] || {}, e = effEnd(r.segs, i);
      rows.push([r.coder, r.pid, condOf(r), r.task, r.label, "segment", ++n, g.t0, e ?? "", e != null ? r1(e - g.t0) : "", fmt(g.t0, true), e != null ? fmt(e, true) : "",
        g.stage, s.name, s.loop === "F" ? "foraging" : "sensemaking", 0, g.art ?? "", "", g.focus || "", boxesCsv(g), shotT(g), g.note, wall(g.t0)]);
    }
  }
  download(`process_segments_${Date.now()}.csv`, rows);
});
$("csvSeq").addEventListener("click", () => {
  const rows = [["coder", "pid", "cond", "task", "session_label", "n_nodes", "n_segments", "n_markers", "sequence", "stage_numbers", "markers", "session_note"]];
  for (const r of allRecs()) {
    const ps = r.pins || [], items = seqItems(r).filter((it) => !(it.k === "p" && isMarker(it.p)));
    rows.push([r.coder, r.pid, condOf(r), r.task, r.label, ps.filter((p) => !isMarker(p)).length, r.segs.length, ps.filter(isMarker).length, seqText(r),
      items.map((it) => (it.k === "p" ? it.p.stage : it.g.stage)).join(" "), ps.filter(isMarker).map((p) => `${p.kind}@${fmt(p.t)}`).join("; "), r.note]);
  }
  download(`process_sequences_${Date.now()}.csv`, rows);
});

load();
</script>
